name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t parks-passport:ci .
      - name: Container answers /healthz
        run: |
          docker run -d --name pp -p 8080:8080 -e PORT=8080 --memory=512m parks-passport:ci
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 2
          done
          docker logs pp
          exit 1
